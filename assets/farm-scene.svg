<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" aria-labelledby="title desc" role="img" shape-rendering="crispEdges" viewBox="0 0 800 240"><title id="title">A little pixel farm at sunset</title><desc id="desc">Original pixel art with a drifting cloud, glowing fireflies, a farmhouse, crops, and a waving farmer.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#27365b"/><stop offset="1" stop-color="#d87975"/></linearGradient><style>@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}.cloud{animation:drift 18s linear infinite alternate}.firefly{animation:glow 1.8s steps(2,end) infinite alternate}.firefly.two{animation-delay:.7s}.firefly.three{animation-delay:1.2s}.lantern{animation:lantern 1.5s steps(2,end) infinite alternate}.farmer{animation:bob 1s steps(2,end) infinite;transform-box:fill-box;transform-origin:center bottom}@media (prefers-reduced-motion:reduce){*,::after,::before{animation-duration:.001ms!important;animation-iteration-count:1!important}}</style></defs><rect width="800" height="240" fill="url(#sky)"/><rect width="3" height="3" x="78" y="36" fill="#fff2c0"/><rect width="3" height="3" x="188" y="25" fill="#fff2c0"/><rect width="3" height="3" x="325" y="43" fill="#fff2c0"/><rect width="3" height="3" x="672" y="28" fill="#fff2c0"/><rect width="3" height="3" x="735" y="68" fill="#fff2c0"/><g fill="#f0b1a0" class="cloud"><rect width="48" height="12" x="120" y="60"/><rect width="24" height="12" x="132" y="48"/><rect width="12" height="8" x="108" y="60"/></g><rect width="800" height="28" x="0" y="136" fill="#625b79"/><rect width="800" height="20" x="0" y="152" fill="#48566d"/><rect width="800" height="74" x="0" y="166" fill="#314e48"/><g fill="#324d50"><rect width="18" height="42" x="40" y="116"/><rect width="42" height="24" x="28" y="128"/><rect width="20" height="50" x="728" y="108"/><rect width="48" height="24" x="714" y="122"/></g><rect width="152" height="75" x="278" y="104" fill="#e8bd83"/><rect