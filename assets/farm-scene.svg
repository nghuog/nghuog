<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">A little pixel farm at sunset</title>
<desc id="desc">Original pixel art with a drifting cloud, glowing fireflies, a farmhouse, crops, and a waving farmer.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#27365b"/><stop offset="1" stop-color="#d87975"/></linearGradient>
  <style>
    .cloud { animation: drift 18s linear infinite alternate; }
    .firefly { animation: glow 1.8s steps(2,end) infinite alternate; }
    .firefly.two { animation-delay: .7s; }
    .firefly.three { animation-delay: 1.2s; }
    .lantern { animation: lantern 1.5s steps(2,end) infinite alternate; }
    .farmer { animation: bob 1s steps(2,end) infinite; transform-box: fill-box; transform-origin: center bottom; }
    @keyframes drift { from { transform: translateX(-12px); } to { transform: translateX(30px); } }
    @keyframes glow { from { opacity: .25; } to { opacity: 1; } }
    @keyframes lantern { from { opacity: .65; } to { opacity: 1; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; } }
  </style>
</defs>
<!-- evening sky and blocky hills -->
<rect width="800" height="240" fill="url(#sky)"/>
<rect x="78" y="36" width="3" height="3" fill="#fff2c0"/><rect x="188" y="25" width="3" height="3" fill="#fff2c0"/><rect x="325" y="43" width="3" height="3" fill="#fff2c0"/><rect x="672" y="28" width="3" height="3" fill="#fff2c0"/><rect x="735" y="68" width="3" height="3" fill="#fff2c0"/>
<g class="cloud" fill="#f0b1a0"><rect x="120" y="60" width="48" height="12"/><rect x="132" y="48" width="24" height="12"/><rect x="108" y="60" width="12" height="8"/></g>
<rect x="0" y="136" width="800" height="28" fill="#625b79"/><rect x="0" y="152" width="800" height="20" fill="#48566d"/><rect x="0" y="166" width="800" height="74" fill="#314e48"/>
<!-- distant trees -->
<g fill="#324d50"><rect x="40" y="116" width="18" height="42"/><rect x="28" y="128" width="42" height="24"/><rect x="728" y="108" width="20" height="50"/><rect x="714" y="122" width="48" height="24"/></g>
<!-- farmhouse -->
<rect x="278" y="104" width="152" height="75" fill="#e8bd83"/><rect x="266" y="96" width="176" height="15" fill="#704c5a"/><rect x="290" y="82" width="130" height="15" fill="#704c5a"/><rect x="310" y="69" width="90" height="13" fill="#704c5a"/><rect x="332" y="112" width="44" height="67" fill="#744b50"/><rect x="339" y="120" width="30" height="59" fill="#a56458"/><rect x="296" y="120" width="25" height="23" fill="#8bc4c0"/><rect x="393" y="120" width="25" height="23" fill="#8bc4c0"/><rect x="300" y="147" width="17" height="4" fill="#f5d989"/><rect x="397" y="147" width="17" height="4" fill="#f5d989"/>
<!-- lit windows -->
<g class="lantern"><rect x="300" y="124" width="17" height="15" fill="#ffe49a"/><rect x="397" y="124" width="17" height="15" fill="#ffe49a"/><rect x="307" y="124" width="3" height="15" fill="#a56458"/><rect x="300" y="130" width="17" height="3" fill="#a56458"/><rect x="404" y="124" width="3" height="15" fill="#a56458"/><rect x="397" y="130" width="17" height="3" fill="#a56458"/></g>
<!-- crop rows -->
<path d="M90 202h120m400 0h112M75 219h150m375 0h125" stroke="#80614c" stroke-width="5"/>
<g fill="#83b66b"><rect x="112" y="185" width="6" height="15"/><rect x="126" y="180" width="6" height="20"/><rect x="157" y="185" width="6" height="15"/><rect x="186" y="178" width="6" height="22"/><rect x="584" y="184" width="6" height="16"/><rect x="614" y="178" width="6" height="22"/><rect x="650" y="184" width="6" height="16"/><rect x="680" y="178" width="6" height="22"/></g>
<g fill="#f3c86a"><rect x="123" y="178" width="8" height="6"/><rect x="184" y="176" width="8" height="6"/><rect x="612" y="176" width="8" height="6"/><rect x="678" y="176" width="8" height="6"/></g>
<!-- little waving farmer -->
<g class="farmer"><rect x="478" y="157" width="16" height="25" fill="#dfb47e"/><rect x="474" y="151" width="24" height="8" fill="#79514e"/><rect x="478" y="166" width="16" height="10" fill="#7aa0a0"/><rect x="478" y="181" width="6" height="12" fill="#4d4657"/><rect x="488" y="181" width="6" height="12" fill="#4d4657"/><rect x="470" y="164" width="8" height="6" fill="#dfb47e"/><rect x="494" y="160" width="7" height="5" fill="#dfb47e"/><rect x="498" y="154" width="6" height="7" fill="#dfb47e"/><rect x="474" y="148" width="24" height="5" fill="#b85d52"/><rect x="480" y="143" width="12" height="5" fill="#b85d52"/></g>
<!-- fireflies -->
<g fill="#ffe98d"><rect class="firefly" x="224" y="145" width="4" height="4"/><rect class="firefly two" x="548" y="131" width="4" height="4"/><rect class="firefly three" x="706" y="164" width="4" height="4"/><rect class="firefly two" x="250" y="188" width="3" height="3"/><rect class="firefly" x="530" y="205" width="3" height="3"/></g>
<rect y="230" width="800" height="10" fill="#263d3d"/>
</svg>
